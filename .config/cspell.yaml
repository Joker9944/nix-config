---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
caseSensitive: false
import:
  - ~/Workspace/cspell-dicts/cspell.yaml
dictionaryDefinitions:
  - name: project
    path: ./dictionaries/project.txt
    addWords: true
ignoreRegExpList:
  # Color palette hex values, e.g. "1E1823" or "#B478AE"
  - '"#?[0-9A-Fa-f]{6}"'
ignorePaths:
  - 'secrets.yaml'
  # sops-encrypted payloads live in secrets/ dirs; the ciphertext is noise to a
  # spellchecker and 'secrets.yaml' alone does not cover k3s.yaml or wireguard.yaml
  - '**/secrets/*.yaml'
  - /result
  - .sops.yaml
  - '*.patch'
  - .gitignore
  - .idea
  - flake.lock
  - '@girs'
dictionaries:
  - project
