name: update-pr

inputs:
  branch:
    description: Branch the pull request is opened from
    required: true
  title:
    description: Pull request title
    required: true
  merge-method:
    description: Automerge strategy — merge, squash or rebase
    required: false
    default: squash
  client-id:
    description: Client ID of the GitHub App the commits are authored and signed as
    required: true
  private-key:
    description: Private key of the GitHub App the commits are authored and signed as
    required: true

runs:
  using: "composite"

  steps:

    - name: Create app token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - name: Create Pull Request
      id: git-pr-create
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        branch: ${{ inputs.branch }}
        title: ${{ inputs.title }}

    - name: Enable Automerge
      id: git-pr-automerge
      if: ${{ steps.git-pr-create.outputs.pull-request-number }}
      uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        pull-request-number: ${{ steps.git-pr-create.outputs.pull-request-number }}
        merge-method: ${{ inputs.merge-method }}
