name: nix-flake-check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  nix-flake-check:

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:

      - name: Repository checkout
        id: git-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nix
        id: nix-setup
        uses: ./.github/composites/nix-setup

      - name: Run flake check
        id: nix-check

        run: nix flake check
