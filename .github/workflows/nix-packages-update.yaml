name: nix-packages-update

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * TUE,SAT'

jobs:

  nix-packages-update:

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:

      - name: Repository Checkout
        id: git-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nix
        id: nix-setup
        uses: Joker9944/nix-config/.github/composites/nix-setup@main

      - name: Git Identity
        id: git-identity
        uses: ./.github/composites/git-identity

      - name: Update Packages
        id: nix-update

        run: nix run .#update-packages

      - name: Create Pull Request
        id: update-pr
        uses: ./.github/composites/update-pr

        with:
          branch: ci/nix-packages-update
          title: "chore(deps): package versions"
          merge-method: rebase
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
