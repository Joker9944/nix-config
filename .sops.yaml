# This example uses YAML anchors which allows reuse of multiple keys
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/master/nixos/.sops.yaml
# for a more complex example.
# noinspection SpellCheckingInspection
keys:
  - &joker9944 age1q4hag0cwjs5zr2t3n7d089ukynwpesde8vskudcqvjaydspxfcaqva92xc
  - &tars age1zajf4crkwz4nh3pcad7zrd6kc3k4gr0rjgfx5ck3l0fupcl5a3mqfj7w8v
  - &case age1drps4ft933772m6q44yvjgwkwveefgpmt7d7mcwyrkeqjkl6t5dqv8pye9
  - &kipp age1nypqq8qgg2rqtw7eltshw5348n08grj3z6zqnvr4fl7lrehrfpmq7t0g80
  - &mother age19l6rwy5zj3ysq93nd5zcugxxm3dgnjpqtgfflsf67s68uumhfupqh9wc5w
creation_rules:
  # k3s cluster token — decrypted at system activation via each host's SSH host
  # key. Host age recipients (derived from ssh_host_ed25519_key.pub via
  # ssh-to-age) are appended here during rollout, then the file is re-encrypted.
  # Must stay ABOVE the general rule: sops applies the first matching rule.
  - path_regex: secrets/k3s\.yaml$
    key_groups:
      - age:
        - *joker9944
        - *tars
        - *case
        - *kipp
        - *mother
  # Global secrets
  - path_regex: secrets/[^/]+\.(ya?ml|json|env|ini)$
    key_groups:
      - age:
        - *joker9944
        - *tars
        - *case
        - *kipp
        - *mother
  # User secrets
  - path_regex: joker9944/[^/]+\.(ya?ml|json|env|ini)$
    key_groups:
      - age:
        - *joker9944
